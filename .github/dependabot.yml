# Weekly dependency updates, one grouped pull request per ecosystem. GitHub
# Actions stay pinned by commit SHA; Dependabot updates the SHA and its
# version comment together. The cooldown holds a new release back a week so a
# compromised or yanked version is usually caught before it is proposed.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
