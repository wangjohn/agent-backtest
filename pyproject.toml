[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-backtest"
version = "0.0.1"
description = "Backtest coding agents (Claude Code, Codex, Cursor) on benchmarks built from your own past sessions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John J. Wang" }]
keywords = ["coding agents", "benchmark", "evals", "claude code", "codex", "cursor"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wangjohn/agent-backtest"
Issues = "https://github.com/wangjohn/agent-backtest/issues"
Changelog = "https://github.com/wangjohn/agent-backtest/blob/main/CHANGELOG.md"

[project.scripts]
backtest = "agent_backtest.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
