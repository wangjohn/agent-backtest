name: Release
on:
  push:
    tags:
      - 'v*.*.*'
# Each job asks for what it needs. Only the publish job can mint the OIDC
# token PyPI's trusted publishing accepts, and only inside the protected
# `pypi` environment.
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The tag, passed through the environment and never expanded into a
      # script's text.
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Require the tag to match the package version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be vX.Y.Z"
            exit 1
          fi
          package_version=$(uv version --short)
          if [[ "v$package_version" != "$VERSION" ]]; then
            echo "::error::tag $VERSION does not match package version $package_version"
            exit 1
          fi
      - name: Test
        run: |
          uv sync --locked
          uv run pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure this environment in the repository settings, and register
    # this workflow as a trusted publisher for agent-backtest on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/agent-backtest/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
